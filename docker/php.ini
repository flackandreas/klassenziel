; PHP-Einstellungen fuer Klassenziel.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Ohne "E" fuellt PHP $_ENV nicht aus der Prozessumgebung, und phpdotenv
; liesse eine src/.env Werte setzen, die compose bestimmen soll.
variables_order = "EGPCS"

; Der WebUntis-Export hat wenige hundert KB.
upload_max_filesize = 2M
post_max_size = 3M

; Eine vom Browser mitgebrachte, unbekannte Sitzungskennung wird verworfen
; statt uebernommen.
session.use_strict_mode = 1
session.use_only_cookies = 1

; So lange wie Sitzung::LEBENSDAUER (8 Stunden). Die Vorgabe von PHP raeumt
; eine Sitzung schon nach 24 Minuten ohne Klick weg - eine Klassenseite, die
; laenger offen stand, schickte "Speichern" dann ins Leere.
session.gc_maxlifetime = 28800
