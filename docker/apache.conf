# Ohne diese Zeile meldet Apache bei jedem Start, dass er seinen Namen nicht
# kennt. Der Name wird nirgends ausgewertet: Adressen kommen aus APP_URL.
ServerName localhost

# Zugriffsprotokoll ohne geheime Links.
#
# Der Link einer Klasse ist das einzige, was zwischen der Klassenseite und
# jedem anderen steht. In einem Zugriffsprotokoll stuende er im Klartext - und
# das Protokoll landet in "docker logs", in Sicherungen und bei jeder
# Fehlersuche auf dem Bildschirm. Fuer die oeffentlichen Seiten wird deshalb
# nur festgehalten, dass jemand zugegriffen hat, nicht mit welchem Link.

SetEnvIf Request_URI "^/klassenziel/" klassenziel_geheim

LogFormat "%a %t \"%m /klassenziel/[...] %H\" %>s %b" klassenziel_maskiert

# Das Dockerfile nimmt dem VirtualHost sein eigenes CustomLog und schaltet
# other-vhosts-access-log ab; damit gelten nur diese beiden Zeilen.
<IfModule log_config_module>
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!klassenziel_geheim
    CustomLog ${APACHE_LOG_DIR}/access.log klassenziel_maskiert env=klassenziel_geheim
</IfModule>
